[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jantar"
version = "0.1.0"
description = "Jantar dos Filósofos com threads reais — Grupo CJPY, Sistemas Operacionais (UFG)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Carlos Alberto R. da S. Junior" },
  { name = "Yan Di Nápoli Araújo" },
  { name = "Pedro Crispim Pereira" },
  { name = "João Vitor Justiniano" },
]
dependencies = ["pygame-ce>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
jantar = "jantar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
